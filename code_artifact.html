<style>
    /* ページ全体に星を配置するための設定 */
    #star-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1; /* コンテンツの一番後ろへ */
        pointer-events: none; /* クリックなどの邪魔をしないようにする */
    }
</style>
</head>
<body> 
<!-- 画面全体の星空用キャンバス -->
<canvas id="star-bg"></canvas>

<center div>

<!-- 星空のスクリプト -->
<script>
    const canvas = document.getElementById('star-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function initStars() {
        // ウィンドウのサイズに合わせてキャンバスを広げる
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // アンチエイリアスを無効化し、くっきりとした四角にする
        ctx.imageSmoothingEnabled = false;

        stars = [];
        const numStars = 100; // 画面全体に散らばる星の数
        
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.floor(Math.random() * canvas.width),
                y: Math.floor(Math.random() * canvas.height),
                size: Math.random() > 0.8 ? 2 : 1, // 1pxまたは2pxの四角
                state: Math.floor(Math.random() * 2), // 0: 消灯, 1: 点灯
                timer: Math.floor(Math.random() * 30),
                speed: Math.floor(Math.random() * 40) + 20 // 点滅のスピード
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let star of stars) {
            star.timer++;
            
            // 一定時間が経ったら点灯と消灯を切り替える
            if (star.timer > star.speed) {
                star.state = star.state === 0 ? 1 : 0;
                star.timer = 0;
            }
            
            // 状態が1（点灯）の時だけ、純粋な「白」で四角を描画
            if (star.state === 1) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
            }
        }
        requestAnimationFrame(animate);
    }

    initStars();
    animate();

    // 画面サイズ（ウィンドウ幅）が変わった時にキャンバスサイズも再計算する
    window.addEventListener('resize', initStars);
</script>
</body>
</html>
